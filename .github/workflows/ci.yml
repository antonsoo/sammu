name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm run verify:tuning
      - run: npm run verify:practice
      - run: npm run verify:routes
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser -- /tmp/sammu-review/browser.json
      - run: python3 -m pip install -r scripts/requirements-audio.txt
      - run: python3 scripts/audio-oracle.py /tmp/sammu-review/browser.json
      - run: npm run test:practice -- /tmp/sammu-practice-review/browser.json
      - run: python3 scripts/audio-oracle.py /tmp/sammu-practice-review/browser.json
      - run: npm run test:routes -- /tmp/sammu-routes-review
      - run: python3 scripts/routes-audio-oracle.py /tmp/sammu-routes-review/report.json
      - run: npm run test:navigation
      - run: npm run test:transfers
      - run: npm run test:control-race
